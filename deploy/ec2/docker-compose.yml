name: united

# United Fleetbase production stack (EC2 + managed RDS / ElastiCache / S3).
# Code is bind-mounted from ./api and ./packages exactly like the local dev stack,
# so what was tested locally is what runs here. Secrets live in .env (chmod 600).

x-api: &api
  image: united/fleetbase-api:pinned
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./api:/fleetbase/api
    - ./packages:/fleetbase/packages
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  socket:
    image: socketcluster/socketcluster:v17.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 4
      SOCKETCLUSTER_BROKERS: 2
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://fleet.unitedsoftware.lat:*,https://api.unitedsoftware.lat:*"}'

  application:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - socket

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300"]
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      - application

  scheduler:
    <<: *api
    command: ["go-crond", "--verbose", "root:./crontab"]
    healthcheck:
      disable: true   # image healthcheck probes port 8000; this container only runs cron
    depends_on:
      - application

  console:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./console-dist:/usr/share/nginx/html:ro
      - ./console-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json:ro

AWSTemplateFormatVersion: "2010-09-09"
Description: Fleetbase AWS infrastructure matching the official CloudFormation template docs — ECS Fargate, RDS MySQL, ElastiCache Redis, S3, CloudFront, ALB.

Parameters:
  Project:
    Type: String
    Default: unitedfb
    AllowedPattern: "^[A-Za-z0-9]{3,14}$"
    Description: Alphanumeric prefix for all resources (3-14 characters).

  EnvironmentType:
    Type: String
    Default: development
    AllowedValues: [development, staging, qa, production]

  RootDomainName:
    Type: String
    Default: ""
    Description: Root domain (example.com). Leave empty to use ALB and CloudFront DNS names.

  HostedZoneId:
    Type: String
    Default: ""
    Description: Existing Route53 hosted zone ID. Leave empty to create one when RootDomainName is set.

  ApiSubdomain:
    Type: String
    Default: api

  ConsoleSubdomain:
    Type: String
    Default: console

  SocketSubdomain:
    Type: String
    Default: socket

  DatabaseInstanceType:
    Type: String
    Default: db.t3.micro

  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536

  DatabaseMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 65536

  DatabaseBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35

  DatabaseMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  CacheInstanceType:
    Type: String
    Default: cache.t3.micro

  CacheNumNodes:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 20

  ApiDesiredCount:
    Type: Number
    Default: 1

  ApiMaxCapacity:
    Type: Number
    Default: 2

  EventsDesiredCount:
    Type: Number
    Default: 1

  SchedulerDesiredCount:
    Type: Number
    Default: 1

  SocketDesiredCount:
    Type: Number
    Default: 1

  EnableDetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  EnableVPCFlowLogs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  ApiImage:
    Type: String
    Default: fleetbase/fleetbase-api:latest
    Description: API/events/scheduler image. Override with your ECR URI after push-custom.sh.

  SocketImage:
    Type: String
    Default: socketcluster/socketcluster:v17.4.0

  AppKey:
    Type: String
    NoEcho: true
    Description: Laravel APP_KEY (base64:...). Required. deploy.sh generates this.

  VpcCidr:
    Type: String
    Default: 10.40.0.0/16

Conditions:
  HasDomain: !Not [!Equals [!Ref RootDomainName, ""]]
  CreateHostedZone: !And
    - !Condition HasDomain
    - !Equals [!Ref HostedZoneId, ""]
  UseExistingHostedZone: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  IsMultiAZ: !Equals [!Ref DatabaseMultiAZ, "true"]
  EnableFlowLogs: !Equals [!Ref EnableVPCFlowLogs, "true"]
  IsProduction: !Equals [!Ref EnvironmentType, "production"]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${EnvironmentType}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${EnvironmentType}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${EnvironmentType}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${EnvironmentType}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${EnvironmentType}-private-2

  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  FlowLogsRole:
    Type: AWS::IAM::Role
    Condition: EnableFlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableFlowLogs
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Condition: EnableFlowLogs
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API and workers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SocketSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SocketCluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ApiSecurityGroup

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref SocketSecurityGroup

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Project}-${EnvironmentType}-db
      GenerateSecretString:
        SecretStringTemplate: '{"username":"fleetbase"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  AppKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Project}-${EnvironmentType}-app-key
      SecretString: !Ref AppKey

  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-${EnvironmentType}-files-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-${EnvironmentType}-console-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Project}-${EnvironmentType}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ConsoleBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZone
    Properties:
      Name: !Ref RootDomainName

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Sub ${ApiSubdomain}.${RootDomainName}
      SubjectAlternativeNames:
        - !Sub ${ConsoleSubdomain}.${RootDomainName}
        - !Sub ${SocketSubdomain}.${RootDomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub ${ApiSubdomain}.${RootDomainName}
          HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]
        - DomainName: !Sub ${ConsoleSubdomain}.${RootDomainName}
          HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]
        - DomainName: !Sub ${SocketSubdomain}.${RootDomainName}
          HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If
          - HasDomain
          - - !Sub ${ConsoleSubdomain}.${RootDomainName}
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: console-s3
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: console-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Project}-${EnvironmentType}-jobs
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${Project}-${EnvironmentType}-api
      RetentionInDays: !Ref LogRetentionDays

  EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${Project}-${EnvironmentType}-events
      RetentionInDays: !Ref LogRetentionDays

  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${Project}-${EnvironmentType}-scheduler
      RetentionInDays: !Ref LogRetentionDays

  SocketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${Project}-${EnvironmentType}-socket
      RetentionInDays: !Ref LogRetentionDays

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Fleetbase private subnets
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${Project}-${EnvironmentType}-database
      Engine: mysql
      EngineVersion: "8.0"
      DBInstanceClass: !Ref DatabaseInstanceType
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      MaxAllocatedStorage: !Ref DatabaseMaxAllocatedStorage
      StorageEncrypted: true
      MultiAZ: !If [IsMultiAZ, true, false]
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionPeriod
      DBName: fleetbase
      MasterUsername: fleetbase
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      DeletionProtection: !If [IsProduction, true, false]

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Fleetbase cache subnets
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  CacheCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub ${Project}-${EnvironmentType}-cache
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheInstanceType
      NumCacheNodes: !Ref CacheNumNodes
      Port: 6379
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      VpcSecurityGroupIds:
        - !Ref CacheSecurityGroup

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${Project}-${EnvironmentType}-api
      ImageScanningConfiguration:
        ScanOnPush: true

  ConsoleRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${Project}-${EnvironmentType}-console
      ImageScanningConfiguration:
        ScanOnPush: true

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Project}-${EnvironmentType}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: !If [IsProduction, enabled, disabled]

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${EnvironmentType}-ecs-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !Ref AppKeySecret

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${EnvironmentType}-ecs-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StorageBucket.Arn
                  - !Sub ${StorageBucket.Arn}/*
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt JobQueue.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !Ref AppKeySecret
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${Project}-${EnvironmentType}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Project}-${EnvironmentType}-api
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-399

  SocketTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Project}-${EnvironmentType}-sock
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-399

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasDomain
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref ApiTargetGroup

  HttpSocketRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasDomain
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub ${SocketSubdomain}.${RootDomainName}
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasDomain
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  HttpsSocketRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasDomain
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub ${SocketSubdomain}.${RootDomainName}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SocketTargetGroup

  HttpPathSocketRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /socketcluster
              - /socketcluster/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SocketTargetGroup

  ApiDns:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]
      Name: !Sub ${ApiSubdomain}.${RootDomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  SocketDns:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]
      Name: !Sub ${SocketSubdomain}.${RootDomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  ConsoleDns:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If [UseExistingHostedZone, !Ref HostedZoneId, !Ref HostedZone]
      Name: !Sub ${ConsoleSubdomain}.${RootDomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-${EnvironmentType}-api
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: APP_NAME
              Value: Fleetbase
            - Name: APP_ENV
              Value: !If [IsProduction, production, development]
            - Name: APP_DEBUG
              Value: !If [IsProduction, "false", "true"]
            - Name: APP_URL
              Value: !If [HasDomain, !Sub https://${ApiSubdomain}.${RootDomainName}, !Sub http://${LoadBalancer.DNSName}]
            - Name: CONSOLE_HOST
              Value: !If [HasDomain, !Sub https://${ConsoleSubdomain}.${RootDomainName}, !Sub https://${CloudFrontDistribution.DomainName}]
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentType
            - Name: DB_CONNECTION
              Value: mysql
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: "3306"
            - Name: DB_DATABASE
              Value: fleetbase
            - Name: DB_USERNAME
              Value: fleetbase
            - Name: REDIS_HOST
              Value: !GetAtt CacheCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: "6379"
            - Name: CACHE_DRIVER
              Value: redis
            - Name: QUEUE_CONNECTION
              Value: redis
            - Name: SESSION_DRIVER
              Value: redis
            - Name: BROADCAST_DRIVER
              Value: socketcluster
            - Name: FILESYSTEM_DRIVER
              Value: s3
            - Name: AWS_BUCKET
              Value: !Ref StorageBucket
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: SQS_QUEUE
              Value: !Ref JobQueue
            - Name: LOG_CHANNEL
              Value: stderr
          Secrets:
            - Name: APP_KEY
              ValueFrom: !Ref AppKeySecret
            - Name: DB_PASSWORD
              ValueFrom: !Sub ${DatabaseSecret}:password::
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  EventsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-${EnvironmentType}-events
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: events
          Image: !Ref ApiImage
          Essential: true
          Command: ["php", "artisan", "queue:work"]
          Environment:
            - Name: APP_NAME
              Value: Fleetbase
            - Name: APP_ENV
              Value: !If [IsProduction, production, development]
            - Name: APP_DEBUG
              Value: !If [IsProduction, "false", "true"]
            - Name: APP_URL
              Value: !If [HasDomain, !Sub https://${ApiSubdomain}.${RootDomainName}, !Sub http://${LoadBalancer.DNSName}]
            - Name: CONSOLE_HOST
              Value: !If [HasDomain, !Sub https://${ConsoleSubdomain}.${RootDomainName}, !Sub https://${CloudFrontDistribution.DomainName}]
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentType
            - Name: DB_CONNECTION
              Value: mysql
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: "3306"
            - Name: DB_DATABASE
              Value: fleetbase
            - Name: DB_USERNAME
              Value: fleetbase
            - Name: REDIS_HOST
              Value: !GetAtt CacheCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: "6379"
            - Name: CACHE_DRIVER
              Value: redis
            - Name: QUEUE_CONNECTION
              Value: redis
            - Name: SESSION_DRIVER
              Value: redis
            - Name: BROADCAST_DRIVER
              Value: socketcluster
            - Name: FILESYSTEM_DRIVER
              Value: s3
            - Name: AWS_BUCKET
              Value: !Ref StorageBucket
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: SQS_QUEUE
              Value: !Ref JobQueue
            - Name: LOG_CHANNEL
              Value: stderr
          Secrets:
            - Name: APP_KEY
              ValueFrom: !Ref AppKeySecret
            - Name: DB_PASSWORD
              ValueFrom: !Sub ${DatabaseSecret}:password::
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EventsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: events

  SchedulerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-${EnvironmentType}-scheduler
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: scheduler
          Image: !Ref ApiImage
          Essential: true
          Command: ["go-crond", "--verbose", "root:./crontab"]
          Environment:
            - Name: APP_NAME
              Value: Fleetbase
            - Name: APP_ENV
              Value: !If [IsProduction, production, development]
            - Name: APP_DEBUG
              Value: !If [IsProduction, "false", "true"]
            - Name: APP_URL
              Value: !If [HasDomain, !Sub https://${ApiSubdomain}.${RootDomainName}, !Sub http://${LoadBalancer.DNSName}]
            - Name: CONSOLE_HOST
              Value: !If [HasDomain, !Sub https://${ConsoleSubdomain}.${RootDomainName}, !Sub https://${CloudFrontDistribution.DomainName}]
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentType
            - Name: DB_CONNECTION
              Value: mysql
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: "3306"
            - Name: DB_DATABASE
              Value: fleetbase
            - Name: DB_USERNAME
              Value: fleetbase
            - Name: REDIS_HOST
              Value: !GetAtt CacheCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: "6379"
            - Name: CACHE_DRIVER
              Value: redis
            - Name: QUEUE_CONNECTION
              Value: redis
            - Name: SESSION_DRIVER
              Value: redis
            - Name: BROADCAST_DRIVER
              Value: socketcluster
            - Name: FILESYSTEM_DRIVER
              Value: s3
            - Name: AWS_BUCKET
              Value: !Ref StorageBucket
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: SQS_QUEUE
              Value: !Ref JobQueue
            - Name: LOG_CHANNEL
              Value: stderr
          Secrets:
            - Name: APP_KEY
              ValueFrom: !Ref AppKeySecret
            - Name: DB_PASSWORD
              ValueFrom: !Sub ${DatabaseSecret}:password::
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SchedulerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scheduler

  SocketTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-${EnvironmentType}-socket
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: socket
          Image: !Ref SocketImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: SOCKETCLUSTER_WORKERS
              Value: "2"
            - Name: SOCKETCLUSTER_BROKERS
              Value: "2"
            - Name: SOCKETCLUSTER_OPTIONS
              Value: !If
                - HasDomain
                - !Sub '{"origins":"https://${ConsoleSubdomain}.${RootDomainName}:*,wss://${ConsoleSubdomain}.${RootDomainName}:*"}'
                - '{"origins":"*"}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SocketLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: socket

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: !Sub ${Project}-${EnvironmentType}-api
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref ApiTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ApiSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref ApiMaxCapacity
      MinCapacity: !Ref ApiDesiredCount
      ResourceId: !Sub service/${ECSCluster}/${ApiService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${Project}-${EnvironmentType}-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70

  EventsService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: !Sub ${Project}-${EnvironmentType}-events
      DesiredCount: !Ref EventsDesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref EventsTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ApiSecurityGroup

  SchedulerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: !Sub ${Project}-${EnvironmentType}-scheduler
      DesiredCount: !Ref SchedulerDesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref SchedulerTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ApiSecurityGroup

  SocketService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: !Sub ${Project}-${EnvironmentType}-socket
      DesiredCount: !Ref SocketDesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref SocketTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref SocketSecurityGroup
      LoadBalancers:
        - ContainerName: socket
          ContainerPort: 8000
          TargetGroupArn: !Ref SocketTargetGroup

Outputs:
  ConsoleURL:
    Value: !If
      - HasDomain
      - !Sub https://${ConsoleSubdomain}.${RootDomainName}
      - !Sub https://${CloudFrontDistribution.DomainName}

  ApiURL:
    Value: !If
      - HasDomain
      - !Sub https://${ApiSubdomain}.${RootDomainName}
      - !Sub http://${LoadBalancer.DNSName}

  SocketURL:
    Value: !If
      - HasDomain
      - !Sub wss://${SocketSubdomain}.${RootDomainName}
      - !Sub ws://${LoadBalancer.DNSName}/socketcluster

  VPCId:
    Value: !Ref VPC

  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  CacheEndpoint:
    Value: !GetAtt CacheCluster.RedisEndpoint.Address

  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution

  S3BucketName:
    Value: !Ref StorageBucket

  ConsoleBucketName:
    Value: !Ref ConsoleBucket

  ECSClusterName:
    Value: !Ref ECSCluster

  DatabaseSecretArn:
    Value: !Ref DatabaseSecret

  AppKeySecretArn:
    Value: !Ref AppKeySecret

  LogGroupNames:
    Value: !Sub "${ApiLogGroup},${EventsLogGroup},${SchedulerLogGroup},${SocketLogGroup}"

  SQSQueueURL:
    Value: !Ref JobQueue

  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri

  ConsoleRepositoryUri:
    Value: !GetAtt ConsoleRepository.RepositoryUri

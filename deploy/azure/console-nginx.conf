server {
    listen       4200;
    server_name  _;
    root /usr/share/nginx/html;

    location /navigator/ {
        alias /usr/share/nginx/navigator/;
        autoindex off;
        try_files $uri $uri/ /navigator/index.html;
        types { application/vnd.android.package-archive apk; text/html html; }
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /fleetbase.config.json @config_fallback;
    }
    location @config_fallback { return 200 '{}'; }
}
